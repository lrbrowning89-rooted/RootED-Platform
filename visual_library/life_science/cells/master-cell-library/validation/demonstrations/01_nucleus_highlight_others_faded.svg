<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="asset_title asset_desc" data-asset-id="rooted_master_animal_cell" data-asset-version="1.0.0" data-schema-version="1.0.0">
  <title id="asset_title">RootED canonical master animal cell</title>
  <desc id="asset_desc">A layered instructional animal cell with independently addressable membrane, cytoplasm, nucleus, mitochondria, endoplasmic reticulum, Golgi apparatus, ribosomes, vesicles, lysosomes, and centrioles.</desc>
  <defs>
    <radialGradient id="animal_cytoplasm" cx=".38" cy=".3" r=".75"><stop stop-color="#e0f3f4"/><stop offset=".7" stop-color="#a7ced1"/><stop offset="1" stop-color="#719fa5"/></radialGradient>
    <radialGradient id="animal_nucleus" cx=".35" cy=".3" r=".75"><stop stop-color="#ead2f5"/><stop offset=".65" stop-color="#ae72c9"/><stop offset="1" stop-color="#623a83"/></radialGradient>
    <linearGradient id="animal_mito" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc14c"/><stop offset=".55" stop-color="#de681b"/><stop offset="1" stop-color="#963014"/></linearGradient>
    <linearGradient id="animal_golgi" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3a2ad"/><stop offset="1" stop-color="#a83e65"/></linearGradient>
    <pattern id="animal_texture" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="8" cy="13" r="1.2" fill="#245e68" opacity=".2"/><circle cx="28" cy="25" r=".9" fill="#fff" opacity=".48"/></pattern>
    <filter id="animal_shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#17343b" flood-opacity=".25"/></filter>
    <filter id="highlight_glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#ffd23f" flood-opacity=".95"/></filter>
    <symbol id="animal_mito_symbol" viewBox="-65 -38 130 76"><path d="M-59 2C-57-28-24-39 7-33 39-28 63-13 59 12 54 39 17 39-11 34-40 29-63 25-59 2Z" fill="url(#animal_mito)" stroke="#8d3218" stroke-width="6"/><path d="M-42 5C-34-22-18 18-4-14 6-34 20 22 34-8 41-23 49-5 46 12" fill="none" stroke="#ffe088" stroke-width="5" stroke-linecap="round"/></symbol>
  </defs>
  <style>
    .structure{pointer-events:all;transition:opacity .18s ease,filter .18s ease}.structure.rooted-highlight{filter:url(#highlight_glow)}.structure.rooted-highlight &gt; *{stroke:#17243a;stroke-width:8;paint-order:stroke fill}.rooted-muted{opacity:.2}.label{font:600 25px Arial,sans-serif;fill:#142441;paint-order:stroke;stroke:#fff;stroke-width:8;stroke-linejoin:round}.leader{fill:none;stroke:#17324d;stroke-width:4;marker-end:url(#arrow)}#annotations{display:none}.show-annotations #annotations{display:inline}
  </style>
  <g id="presentation" aria-label="Presentation effects"><rect id="background" width="1000" height="1000" rx="32" fill="#f8fbfa"/><ellipse id="shadows" cx="500" cy="866" rx="327" ry="48" fill="#17343b" opacity=".14" filter="url(#animal_shadow)"/></g>
  <g id="instructional" aria-label="Instructional structures">
    <g id="cell_membrane" class="structure rooted-muted" role="group" aria-label="Cell membrane"><title>Cell membrane</title><circle cx="500" cy="500" r="385" fill="url(#animal_cytoplasm)" stroke="#376d78" stroke-width="15"/><circle cx="500" cy="500" r="369" fill="none" stroke="#e8f6f6" stroke-width="6"/></g>
    <g id="cytoplasm" class="structure rooted-muted" role="group" aria-label="Cytoplasm"><title>Cytoplasm</title><circle cx="500" cy="500" r="362" fill="url(#animal_cytoplasm)"/><circle cx="500" cy="500" r="362" fill="url(#animal_texture)"/></g>
    <g id="rough_er" class="structure rooted-muted" role="group" aria-label="Rough endoplasmic reticulum"><title>Rough endoplasmic reticulum</title><g fill="none" stroke="#24558c" stroke-width="14" stroke-linecap="round"><path d="M313 348C378 254 539 243 628 314"/><path d="M324 382C394 298 523 294 607 347"/><path d="M337 417C405 351 505 345 584 380"/><path d="M353 451C422 405 493 399 557 415"/></g><g id="rough_er_ribosomes" fill="#65417c" stroke="#fff" stroke-width="2"><circle cx="346" cy="320" r="6"/><circle cx="401" cy="282" r="6"/><circle cx="467" cy="270" r="6"/><circle cx="540" cy="282" r="6"/><circle cx="598" cy="307" r="6"/></g></g>
    <g id="smooth_er" class="structure rooted-muted" role="group" aria-label="Smooth endoplasmic reticulum"><title>Smooth endoplasmic reticulum</title><g fill="none" stroke="#4a9d98" stroke-width="12" stroke-linecap="round"><path d="M345 465C291 505 293 585 355 612S470 600 487 550"/><path d="M378 474C335 510 340 561 382 577S448 569 463 538"/><path d="M409 486C378 511 386 545 416 549"/></g></g>
    <g id="nucleus" class="structure rooted-highlight" role="group" aria-label="Nucleus"><title>Nucleus</title><circle cx="555" cy="382" r="150" fill="url(#animal_nucleus)" stroke="#583672" stroke-width="13"/><circle cx="555" cy="382" r="134" fill="none" stroke="#eddcf5" stroke-width="5" stroke-dasharray="12 9"/><g opacity=".35" fill="#573070"><circle cx="505" cy="344" r="13"/><circle cx="602" cy="322" r="10"/><circle cx="631" cy="420" r="15"/><circle cx="515" cy="450" r="10"/></g><g id="nucleolus" class="structure" role="group" aria-label="Nucleolus"><title>Nucleolus</title><circle cx="568" cy="397" r="48" fill="#573077" stroke="#3e245b" stroke-width="8"/><circle cx="552" cy="381" r="15" fill="#b996d0" opacity=".68"/></g></g>
    <g id="golgi_apparatus" class="structure rooted-muted" role="group" aria-label="Golgi apparatus"><title>Golgi apparatus</title><g fill="none" stroke="url(#animal_golgi)" stroke-width="18" stroke-linecap="round"><path d="M523 616C610 571 715 584 765 633"/><path d="M515 652C607 610 714 626 770 676"/><path d="M526 689C615 653 704 668 749 711"/><path d="M553 722C623 699 685 707 719 735"/></g></g>
    <g id="mitochondria" class="structure rooted-muted" role="group" aria-label="Mitochondria"><title>Mitochondria</title><g id="mitochondrion_01" class="structure" transform="translate(265 320) rotate(-45) scale(1.08)"><use href="#animal_mito_symbol" x="-65" y="-38" width="130" height="76"/></g><g id="mitochondrion_02" class="structure" transform="translate(260 638) rotate(62)"><use href="#animal_mito_symbol" x="-65" y="-38" width="130" height="76"/></g><g id="mitochondrion_03" class="structure" transform="translate(545 790) rotate(7)"><use href="#animal_mito_symbol" x="-65" y="-38" width="130" height="76"/></g></g>
    <g id="ribosomes" class="structure rooted-muted" role="group" aria-label="Ribosomes"><title>Ribosomes</title><g fill="#754b8c" stroke="#fff" stroke-width="2"><circle id="ribosome_01" cx="227" cy="485" r="7"/><circle id="ribosome_02" cx="728" cy="335" r="7"/><circle id="ribosome_03" cx="477" cy="734" r="7"/><circle id="ribosome_04" cx="794" cy="515" r="7"/><circle id="ribosome_05" cx="345" cy="716" r="7"/></g></g>
    <g id="vesicles" class="structure rooted-muted" role="group" aria-label="Vesicles"><title>Vesicles</title><g fill="#8fcce1" stroke="#3d7895" stroke-width="4"><circle id="vesicle_01" cx="185" cy="412" r="19"/><circle id="vesicle_02" cx="763" cy="255" r="16"/><circle id="vesicle_03" cx="807" cy="588" r="21"/><circle id="vesicle_04" cx="420" cy="806" r="17"/></g></g>
    <g id="lysosomes" class="structure rooted-muted" role="group" aria-label="Lysosomes"><title>Lysosomes</title><g fill="#b875c8" stroke="#6d3c85" stroke-width="5"><circle id="lysosome_01" cx="208" cy="540" r="22"/><circle id="lysosome_02" cx="742" cy="463" r="24"/><circle id="lysosome_03" cx="665" cy="795" r="21"/></g></g>
    <g id="centrioles" class="structure rooted-muted" role="group" aria-label="Centrioles"><title>Centrioles</title><g transform="translate(404 685)"><g id="centriole_01" transform="rotate(-32)"><rect x="-18" y="-62" width="36" height="124" rx="13" fill="#e8b61f" stroke="#a36d0b" stroke-width="5"/><g stroke="#fff09a" stroke-width="4"><path d="M-10-48H10M-10-28H10M-10-8H10M-10 12H10M-10 32H10M-10 52H10"/></g></g><g id="centriole_02" transform="translate(54 20) rotate(62)"><rect x="-18" y="-62" width="36" height="124" rx="13" fill="#e8b61f" stroke="#a36d0b" stroke-width="5"/><g stroke="#fff09a" stroke-width="4"><path d="M-10-48H10M-10-28H10M-10-8H10M-10 12H10M-10 32H10M-10 52H10"/></g></g></g></g>
  </g>
  <g id="presentation_foreground" aria-label="Foreground presentation effects" pointer-events="none"><path id="highlights" d="M229 295C352 140 617 93 785 249" fill="none" stroke="#fff" stroke-width="14" opacity=".42" stroke-linecap="round"/><circle id="texture_overlay" cx="500" cy="500" r="375" fill="none" stroke="#fff" stroke-width="3" opacity=".45"/></g>
  <g id="annotations" aria-label="Optional labels arrows and callouts">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#17324d"/></marker></defs>
    <g id="labels"><text class="label" x="34" y="160">Cell membrane</text><path class="leader" d="M243 166L281 236"/><text class="label" x="754" y="165">Nucleus</text><path class="leader" d="M786 177L667 286"/><text class="label" x="30" y="797">Mitochondrion</text><path class="leader" d="M248 788L277 675"/><text class="label" x="760" y="770">Golgi apparatus</text><path class="leader" d="M790 748L730 708"/></g>
    <g id="arrows"/><g id="callouts"/>
  </g>
</svg>

