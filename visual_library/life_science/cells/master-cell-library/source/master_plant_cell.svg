<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="asset_title asset_desc" data-asset-id="rooted_master_plant_cell" data-asset-version="1.0.0" data-schema-version="1.0.0">
  <title id="asset_title">RootED canonical master plant cell</title>
  <desc id="asset_desc">A layered instructional plant cell with independently addressable wall, membrane, cytoplasm, nucleus, vacuole, chloroplasts, mitochondria, endoplasmic reticulum, Golgi apparatus, ribosomes, and vesicles.</desc>
  <defs>
    <linearGradient id="wall_fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2bd"/><stop offset=".46" stop-color="#d9ab55"/><stop offset="1" stop-color="#9c7138"/></linearGradient>
    <radialGradient id="cytoplasm_fill" cx=".38" cy=".3" r=".75"><stop stop-color="#d9f2f3"/><stop offset=".7" stop-color="#9fc9cd"/><stop offset="1" stop-color="#72a7ad"/></radialGradient>
    <radialGradient id="vacuole_fill" cx=".35" cy=".25" r=".8"><stop stop-color="#e7f8ff"/><stop offset=".7" stop-color="#abd9ed"/><stop offset="1" stop-color="#7cb6d0"/></radialGradient>
    <radialGradient id="nucleus_fill" cx=".35" cy=".3" r=".75"><stop stop-color="#e9c9f4"/><stop offset=".65" stop-color="#ad6fca"/><stop offset="1" stop-color="#6b398c"/></radialGradient>
    <linearGradient id="organelle_green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b5d95d"/><stop offset=".55" stop-color="#5e922a"/><stop offset="1" stop-color="#315d1e"/></linearGradient>
    <linearGradient id="mito_fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb84d"/><stop offset=".55" stop-color="#dd681c"/><stop offset="1" stop-color="#9e3214"/></linearGradient>
    <linearGradient id="golgi_fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f29ca6"/><stop offset="1" stop-color="#a33c60"/></linearGradient>
    <filter id="soft_shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#17343b" flood-opacity=".24"/></filter>
    <filter id="highlight_glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#ffd23f" flood-opacity=".95"/></filter>
    <pattern id="cytoplasm_texture" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="7" cy="11" r="1.2" fill="#245e68" opacity=".2"/><circle cx="28" cy="25" r=".9" fill="#fff" opacity=".48"/></pattern>
    <symbol id="chloroplast_symbol" viewBox="-70 -45 140 90">
      <ellipse rx="66" ry="40" fill="url(#organelle_green)" stroke="#244f22" stroke-width="6"/>
      <ellipse rx="56" ry="31" fill="none" stroke="#cbe66e" stroke-width="3" opacity=".8"/>
      <g fill="#274f20" stroke="#a7cc54" stroke-width="2">
        <rect x="-39" y="-18" width="25" height="9" rx="4"/><rect x="-39" y="-5" width="25" height="9" rx="4"/><rect x="-39" y="8" width="25" height="9" rx="4"/>
        <rect x="8" y="-18" width="25" height="9" rx="4"/><rect x="8" y="-5" width="25" height="9" rx="4"/><rect x="8" y="8" width="25" height="9" rx="4"/>
      </g>
      <path d="M-14-14C-4-8-3 7 8 13" fill="none" stroke="#d7eb8b" stroke-width="3"/>
    </symbol>
    <symbol id="mitochondrion_symbol" viewBox="-65 -38 130 76">
      <path d="M-59 2C-57-28-24-39 7-33 39-28 63-13 59 12 54 39 17 39-11 34-40 29-63 25-59 2Z" fill="url(#mito_fill)" stroke="#8d3218" stroke-width="6"/>
      <path d="M-42 5C-34-22-18 18-4-14 6-34 20 22 34-8 41-23 49-5 46 12" fill="none" stroke="#ffe088" stroke-width="5" stroke-linecap="round"/>
    </symbol>
  </defs>
  <style>
    .structure{pointer-events:all;transition:opacity .18s ease,filter .18s ease}.structure.rooted-highlight{filter:url(#highlight_glow)}.structure.rooted-highlight &gt; *{stroke:#17243a;stroke-width:8;paint-order:stroke fill}.rooted-muted{opacity:.2}.target-outline{fill:none;stroke:#ffd23f;stroke-width:14;stroke-dasharray:22 12;vector-effect:non-scaling-stroke}.label{font:600 25px Arial,sans-serif;fill:#142441;paint-order:stroke;stroke:#fff;stroke-width:8;stroke-linejoin:round}.leader{fill:none;stroke:#17324d;stroke-width:4;marker-end:url(#arrow)}#annotations{display:none}.show-annotations #annotations{display:inline}
  </style>
  <g id="presentation" aria-label="Presentation effects">
    <rect id="background" width="1000" height="1000" rx="32" fill="#f8fbfa"/>
    <path id="shadows" d="M187 888C330 944 696 955 835 886" fill="none" stroke="#17343b" stroke-width="42" opacity=".12" filter="url(#soft_shadow)"/>
  </g>
  <g id="instructional" aria-label="Instructional structures">
    <g id="cell_wall" class="structure" role="group" aria-label="Cell wall"><title>Cell wall</title><path d="M180 111Q500 42 820 111L890 182Q945 500 890 818L820 889Q500 958 180 889L110 818Q55 500 110 182Z" fill="url(#wall_fill)" stroke="#7b5c2e" stroke-width="12"/><path d="M184 137Q500 73 816 137L862 190Q911 500 862 810L816 863Q500 927 184 863L138 810Q89 500 138 190Z" fill="#fff0b5" opacity=".65" stroke="#b47d32" stroke-width="5"/></g>
    <g id="cell_membrane" class="structure" role="group" aria-label="Cell membrane"><title>Cell membrane</title><path d="M190 151Q500 91 810 151L846 198Q888 500 846 802L810 849Q500 909 190 849L154 802Q112 500 154 198Z" fill="url(#cytoplasm_fill)" stroke="#2d6873" stroke-width="12"/><path d="M200 167Q500 111 800 167L829 207Q866 500 829 793L800 833Q500 889 200 833L171 793Q134 500 171 207Z" fill="none" stroke="#e8f7f7" stroke-width="5"/></g>
    <g id="cytoplasm" class="structure" role="group" aria-label="Cytoplasm"><title>Cytoplasm</title><path d="M201 169Q500 113 798 169L827 209Q863 500 827 791L798 831Q500 887 201 831L173 791Q137 500 173 209Z" fill="url(#cytoplasm_fill)"/><path d="M201 169Q500 113 798 169L827 209Q863 500 827 791L798 831Q500 887 201 831L173 791Q137 500 173 209Z" fill="url(#cytoplasm_texture)" opacity=".75"/></g>
    <g id="central_vacuole" class="structure" role="group" aria-label="Central vacuole"><title>Central vacuole</title><path d="M262 300C323 213 456 210 521 288 576 354 568 460 553 563 536 680 477 780 359 764 263 751 222 670 223 570 224 470 207 377 262 300Z" fill="url(#vacuole_fill)" stroke="#5a91ac" stroke-width="9"/><path d="M279 316C337 245 443 242 496 304" fill="none" stroke="#fff" stroke-width="11" opacity=".55" stroke-linecap="round"/></g>
    <g id="rough_er" class="structure" role="group" aria-label="Rough endoplasmic reticulum"><title>Rough endoplasmic reticulum</title><g fill="none" stroke="#23558c" stroke-width="13" stroke-linecap="round"><path d="M511 278C586 210 710 234 740 314"/><path d="M518 306C594 251 691 264 722 333"/><path d="M524 337C588 295 667 307 701 363"/><path d="M530 369C590 336 645 348 680 396"/></g><g id="rough_er_ribosomes" fill="#623d76" stroke="#fff" stroke-width="2"><circle cx="550" cy="251" r="6"/><circle cx="597" cy="230" r="6"/><circle cx="650" cy="233" r="6"/><circle cx="713" cy="270" r="6"/><circle cx="551" cy="301" r="6"/><circle cx="612" cy="275" r="6"/><circle cx="683" cy="294" r="6"/></g></g>
    <g id="smooth_er" class="structure" role="group" aria-label="Smooth endoplasmic reticulum"><title>Smooth endoplasmic reticulum</title><g fill="none" stroke="#4aa19d" stroke-width="11" stroke-linecap="round"><path d="M572 395C648 377 729 397 754 455S716 534 654 523"/><path d="M587 425C652 415 708 432 718 470S684 508 626 497"/><path d="M603 454C641 450 676 460 681 480"/></g></g>
    <g id="nucleus" class="structure" role="group" aria-label="Nucleus"><title>Nucleus</title><circle cx="610" cy="307" r="126" fill="url(#nucleus_fill)" stroke="#583372" stroke-width="12"/><circle cx="610" cy="307" r="111" fill="none" stroke="#ebd7f4" stroke-width="5" stroke-dasharray="11 9"/><g opacity=".35" fill="#573070"><circle cx="565" cy="272" r="12"/><circle cx="651" cy="255" r="10"/><circle cx="670" cy="333" r="14"/><circle cx="579" cy="356" r="9"/></g><g id="nucleolus" class="structure" role="group" aria-label="Nucleolus"><title>Nucleolus</title><circle cx="620" cy="317" r="42" fill="#573077" stroke="#3f245e" stroke-width="8"/><circle cx="606" cy="303" r="13" fill="#b996d0" opacity=".65"/></g></g>
    <g id="golgi_apparatus" class="structure" role="group" aria-label="Golgi apparatus"><title>Golgi apparatus</title><g fill="none" stroke="url(#golgi_fill)" stroke-width="16" stroke-linecap="round"><path d="M560 574C632 537 714 545 762 582"/><path d="M551 605C628 570 719 581 770 620"/><path d="M553 638C629 609 708 619 751 654"/><path d="M574 669C636 648 691 654 724 678"/></g></g>
    <g id="chloroplasts" class="structure" role="group" aria-label="Chloroplasts"><title>Chloroplasts</title><g id="chloroplast_01" class="structure" transform="translate(280 250) rotate(-12)"><use href="#chloroplast_symbol" x="-70" y="-45" width="140" height="90"/></g><g id="chloroplast_02" class="structure" transform="translate(737 720) rotate(-24)"><use href="#chloroplast_symbol" x="-70" y="-45" width="140" height="90"/></g><g id="chloroplast_03" class="structure" transform="translate(250 735) rotate(35)"><use href="#chloroplast_symbol" x="-70" y="-45" width="140" height="90"/></g></g>
    <g id="mitochondria" class="structure" role="group" aria-label="Mitochondria"><title>Mitochondria</title><g id="mitochondrion_01" class="structure" transform="translate(630 770) rotate(10)"><use href="#mitochondrion_symbol" x="-65" y="-38" width="130" height="76"/></g><g id="mitochondrion_02" class="structure" transform="translate(780 458) rotate(72) scale(.8)"><use href="#mitochondrion_symbol" x="-65" y="-38" width="130" height="76"/></g></g>
    <g id="ribosomes" class="structure" role="group" aria-label="Ribosomes"><title>Ribosomes</title><g fill="#744886" stroke="#fff" stroke-width="2"><circle id="ribosome_01" cx="457" cy="237" r="7"/><circle id="ribosome_02" cx="764" cy="338" r="7"/><circle id="ribosome_03" cx="476" cy="713" r="7"/><circle id="ribosome_04" cx="811" cy="610" r="7"/><circle id="ribosome_05" cx="203" cy="520" r="7"/></g></g>
    <g id="vesicles" class="structure" role="group" aria-label="Vesicles"><title>Vesicles</title><g fill="#8ccbe0" stroke="#3b7895" stroke-width="4"><circle id="vesicle_01" cx="477" cy="194" r="15"/><circle id="vesicle_02" cx="807" cy="554" r="18"/><circle id="vesicle_03" cx="502" cy="802" r="16"/><circle id="vesicle_04" cx="208" cy="430" r="13"/></g></g>
  </g>
  <g id="presentation_foreground" aria-label="Foreground presentation effects" pointer-events="none"><path id="highlights" d="M190 198Q475 129 756 177" fill="none" stroke="#fff" stroke-width="13" opacity=".42" stroke-linecap="round"/><path id="texture_overlay" d="M202 170Q500 115 798 170" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/></g>
  <g id="annotations" aria-label="Optional labels arrows and callouts">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#17324d"/></marker></defs>
    <g id="labels"><text class="label" x="35" y="105">Cell wall</text><path class="leader" d="M160 100L210 135"/><text class="label" x="35" y="165">Cell membrane</text><path class="leader" d="M230 160L185 185"/><text class="label" x="745" y="126">Nucleus</text><path class="leader" d="M750 135L691 218"/><text class="label" x="28" y="690">Central vacuole</text><path class="leader" d="M220 681L298 650"/><text class="label" x="960" y="790" text-anchor="end">Chloroplast</text><path class="leader" d="M790 770L735 733"/></g>
    <g id="arrows"/><g id="callouts"/>
  </g>
</svg>
